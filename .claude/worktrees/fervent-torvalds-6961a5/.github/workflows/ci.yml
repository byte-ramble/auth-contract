name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  forge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Format Check
        run: forge fmt --check

      - name: Build
        run: forge build

      - name: Test
        run: forge test --offline -vv

      - name: Coverage
        run: forge coverage --offline --report summary
