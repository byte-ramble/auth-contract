[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
solc_version = "0.8.19"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/"
]

[fmt]
line_length = 120
bracket_spacing = true
int_types = "long"
multiline_func_header = "params_first"
quote_style = "double"
number_underscore = "thousands"
wrap_comments = false
